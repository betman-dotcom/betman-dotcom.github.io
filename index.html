<html lang="tr">
<head>

<style>
:root{color-scheme:dark;--bg:#050505;--panel:#0b0b0b;--line:#252525;--gold:#e8bd35;--muted:#8b8b8b;--blue:#5594ff;--green:#37b879;--red:#e15b5b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 32%,#15170e 0,#090909 43%,#030303 78%);color:#f6f6f6;font-family:Arial,Helvetica,sans-serif}
header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,34px);border-bottom:1px solid #1d1d1d;background:rgba(0,0,0,.88);position:relative;z-index:5}.brand{font-size:clamp(25px,3vw,34px);font-weight:1000;letter-spacing:5px}.header-tag{position:absolute;left:50%;transform:translateX(-50%);padding:10px 25px;border:1px solid #353535;background:#111;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:4px}.header-spacer{width:110px}
main{max-width:1900px;margin:auto}.section-label{padding:18px 30px 0;color:#777;font-size:10px;letter-spacing:2.5px;font-weight:800}.gallery-wrap{position:relative;padding:10px 0 28px}.gallery{display:flex;align-items:center;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:32px max(28px,calc((100vw - 1760px)/2))}.gallery::-webkit-scrollbar{display:none}
.match-card{position:relative;isolation:isolate;flex:0 0 clamp(245px,18.2vw,345px);height:430px;overflow:hidden;border:1px solid #292929;border-radius:5px;background:#111;scroll-snap-align:center;opacity:.62;transform:scale(.88);transition:transform .32s ease,opacity .32s ease,border-color .32s ease,box-shadow .32s ease;cursor:pointer}.match-card::before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--cover,linear-gradient(145deg,#28352b,#101510 55%,#050505));background-position:center;background-size:cover;transition:transform .5s ease}.match-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.54),rgba(0,0,0,.13) 37%,rgba(0,0,0,.28) 57%,rgba(0,0,0,.96) 100%)}.match-card.active{flex-basis:clamp(290px,21.5vw,400px);height:570px;opacity:1;transform:scale(1);border-color:#8a7224;box-shadow:0 0 38px rgba(41,92,255,.16),0 0 25px rgba(232,189,53,.11);z-index:2}.match-card.active::before{transform:scale(1.025)}
.league{position:absolute;top:17px;left:15px;padding:7px 9px;background:rgba(0,0,0,.8);color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1.5px}.number{position:absolute;top:21px;right:15px;color:#ddd;font-size:11px;font-weight:900}.teams{position:absolute;inset:26% 8% 25%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;text-shadow:0 3px 10px #000}.team{font-size:clamp(21px,2vw,30px);font-weight:1000;line-height:1.13;text-transform:uppercase}.active .team{font-size:clamp(27px,2.3vw,37px)}.vs{margin:15px 0;color:#d0d0d0;font-size:13px;font-weight:900}.card-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 13px;border-top:1px solid #ffffff25;background:#0009;color:#c6c6c6;font-size:11px}.status{font-weight:900;letter-spacing:.4px;text-align:right}.pending{color:var(--blue)}.win{color:var(--green)}.loss{color:var(--red)}
.arrow{position:absolute;top:49%;z-index:5;transform:translateY(-50%);width:43px;height:58px;border:1px solid #4a4a4a;border-radius:3px;background:#000d;color:#f0cc4c;font-size:29px;cursor:pointer}.arrow:disabled{opacity:.25;cursor:default}.arrow.left{left:9px}.arrow.right{right:9px}
.details{display:grid;grid-template-columns:1.05fr 2fr 1.05fr;min-height:148px;margin:0 14px 16px;overflow:hidden;border:1px solid #282828;border-radius:5px;background:linear-gradient(100deg,#0c0c0c,#080808);box-shadow:0 12px 35px #0006}.detail-cell{display:flex;flex-direction:column;justify-content:center;padding:22px 27px;min-width:0}.detail-cell+.detail-cell{border-left:1px solid #292929}.eyebrow{margin-bottom:10px;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:2.5px}.detail-cell h1{margin:0 0 8px;font-size:clamp(19px,2vw,26px);font-weight:900}.sub{color:#888;font-size:11px;letter-spacing:.4px}.comment{color:#c9c9c9;font-size:15px;line-height:1.85}.prediction{margin-bottom:8px;font-size:22px;font-weight:900}.prediction-note{font-size:11px;font-weight:800;letter-spacing:.5px}.footer{display:flex;justify-content:space-between;gap:15px;padding:0 14px 22px;color:#555;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.editor-toggle{display:none;margin:0 14px 12px;padding:12px 16px;border:1px solid #66551e;border-radius:4px;background:#111;color:var(--gold);font-weight:900;letter-spacing:1px;cursor:pointer}.editor{display:none;margin:0 14px 22px;padding:18px;border:1px solid #353535;border-radius:5px;background:#0b0b0b}.editor.open{display:block}.editor h2{margin:0 0 14px;color:var(--gold);font-size:14px;letter-spacing:2px}.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.editor label{display:flex;flex-direction:column;gap:6px;color:#aaa;font-size:11px;font-weight:800;letter-spacing:.6px}.editor input,.editor textarea,.editor select{width:100%;padding:11px;border:1px solid #333;border-radius:3px;background:#151515;color:#fff;font:inherit}.editor textarea{min-height:100px;resize:vertical}.editor .wide{grid-column:1/-1}.editor-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.editor-actions button,.login-box button{padding:11px 16px;border:1px solid #806a22;background:#211b0b;color:var(--gold);font-weight:900;cursor:pointer}.editor-actions .cancel{border-color:#444;background:#171717;color:#bbb}.editor-actions .danger{border-color:#813838;background:#241010;color:#f2a0a0}.login-box{display:none;margin:0 14px 14px;padding:15px;border:1px solid #333;background:#0b0b0b}.login-box.open{display:block}.login-box input{padding:10px;margin-right:8px;background:#151515;border:1px solid #333;color:white}.login-box button{margin:4px}.hint{color:#999;font-size:12px;margin-top:10px}.hidden{display:none!important}
@media(max-width:760px){header{height:62px;padding:0 15px}.brand{font-size:24px;letter-spacing:4px}.header-tag{padding:9px 14px;font-size:10px;letter-spacing:2px}.header-spacer{width:70px}.section-label{padding:15px 16px 0}.gallery{gap:9px;padding:25px 10vw 28px}.match-card{flex-basis:76vw;height:365px;transform:scale(.9)}.match-card.active{flex-basis:81vw;height:475px}.team{font-size:24px}.active .team{font-size:29px}.arrow{width:34px;height:45px;font-size:23px}.arrow.left{left:4px}.arrow.right{right:4px}.details{grid-template-columns:1fr;margin:0 10px 13px}.detail-cell{padding:17px 19px}.detail-cell+.detail-cell{border-left:0;border-top:1px solid #292929}.comment{font-size:14px}.detail-cell h1{font-size:21px}.footer{padding:0 10px 18px;font-size:8px;letter-spacing:1px}.editor-grid{grid-template-columns:1fr}.editor .wide{grid-column:auto}.login-box input{display:block;width:100%;margin:8px 0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">BETMAN</div><div class="header-tag">TAHMİN</div><div class="header-spacer"></div></header>
<main>
<div class="section-label">MAÇLAR <span style="color:#444">/ KAYDIRARAK KEŞFET</span></div>
<section class="gallery-wrap" aria-label="Maç kapakları"><button class="arrow left" id="prev" type="button">‹</button><div class="gallery" id="gallery" tabindex="0"></div><button class="arrow right" id="next" type="button">›</button></section>
<section class="details" aria-live="polite"><div class="detail-cell"><div class="eyebrow">BETMAN'IN MAÇ YORUMU</div><h1 id="matchTitle">Maçlar yükleniyor…</h1><div class="sub" id="matchMeta"></div></div><div class="detail-cell"><div class="comment" id="matchComment"></div></div><div class="detail-cell"><div class="eyebrow">BETMAN TAHMİNİ</div><div class="prediction" id="matchPrediction"></div><div class="prediction-note pending" id="matchResult"></div></div></section>
<div id="loginBox" class="login-box"><strong>YÖNETİCİ GİRİŞİ</strong><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn">GİRİŞ YAP</button><button id="logoutBtn" class="hidden">ÇIKIŞ YAP</button><div class="hint" id="loginMessage">Düzenleme alanı yalnızca yönetici hesabına açıktır.</div></div>
<button class="editor-toggle" id="editToggle" type="button">✎ SEÇİLİ MAÇI DÜZENLE</button>
<section class="editor" id="editor"><h2>SEÇİLİ MAÇIN BİLGİLERİ</h2><div class="editor-grid">
<label>Ev sahibi takım<input id="homeTeam" type="text"></label><label>Deplasman takımı<input id="awayTeam" type="text"></label>
<label>Lig / tarih / saat<input id="meta" type="text" placeholder="30 EKİM · 20:00 · SÜPER LİG"></label><label>Skor / sonuç<input id="score" type="text" placeholder="2-1"></label>
<label>Tahmin<input id="prediction" type="text" placeholder="MS 1 · 2-0"></label><label>Durum<select id="status"><option value="Yaklaşan">Bekleniyor</option><option value="Kazanç">Kazanç</option><option value="Kayıp">Kayıp</option></select></label>
<label class="wide">Maç yorumu<textarea id="commentary"></textarea></label><label class="wide">Kapak görseli (JPG, PNG veya WEBP · en fazla 5 MB)<input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label class="wide"><span><input id="published" type="checkbox" style="width:auto"> Ziyaretçilere yayımla</span></label>
</div><div class="editor-actions"><button id="saveBtn">DEĞİŞİKLİKLERİ KAYDET</button><button id="newBtn">YENİ MAÇ EKLE</button><button id="deleteBtn" class="danger">MAÇI SİL</button><button id="cancelBtn" class="cancel">KAPAT</button></div><div class="hint" id="saveMessage"></div></section>
<div class="footer"><span>BETMAN · MAÇ YORUMU VE ANALİZ</span><span>← YATAY KAYDIR / OK TUŞLARI →</span></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const SUPABASE_URL='https://mhftcnlfhpfkgfdrepgi.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_RFUBnvUbeueVG7hp_oIK2g_ET4TH3qN';
const ADMIN_EMAIL='mertyilmazpiramit@hotmail.com';
const BUCKET='match-covers';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let matches=[],active=0,user=null,editingId=null;
const gallery=$('gallery');
const statusClass=s=>s==='Kazanç'?'win':s==='Kayıp'?'loss':'pending';
const resultText=m=>m.status==='Yaklaşan'?'BEKLENİYOR':(m.score?`${m.status.toLocaleUpperCase('tr-TR')} · ${m.score}`:m.status.toLocaleUpperCase('tr-TR'));
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 gallery.innerHTML='';
 matches.forEach((m,i)=>{
 const parts=[m.home_team||'EV SAHİBİ',m.away_team||'DEPLASMAN'];
 const card=document.createElement('article');card.className='match-card'+(i===active?' active':'');card.dataset.index=i;
 if(m.cover_url)card.style.setProperty('--cover',`url("${m.cover_url.replace(/"/g,'%22')}")`);
 card.innerHTML=`<span class="league">${esc(m.prediction||'TAHMİN')}</span><span class="number">MAÇ ${String(i+1).padStart(2,'0')}</span><div class="teams"><div class="team">${esc(parts[0])}</div><div class="vs">VS</div><div class="team">${esc(parts[1])}</div></div><div class="card-bottom"><span>${esc(m.match_time||'')}</span><span class="status ${statusClass(m.status)}">${esc(resultText(m))}</span></div>`;
 card.addEventListener('click',()=>setActive(i));gallery.appendChild(card);
 });
 if(matches.length){active=Math.min(active,matches.length-1);updateDetails();}else{$('matchTitle').textContent='Henüz yayımlanmış maç yok';$('matchMeta').textContent='';$('matchComment').textContent='Yeni maçlar yakında burada.';$('matchPrediction').textContent='—';$('matchResult').textContent='';}
 $('prev').disabled=active<=0;$('next').disabled=active>=matches.length-1;
}
function updateDetails(){const m=matches[active];if(!m)return;$('matchTitle').textContent=`${m.home_team} – ${m.away_team}`;$('matchMeta').textContent=m.match_time||'';$('matchComment').textContent=m.commentary||'';$('matchPrediction').textContent=m.prediction||'—';$('matchResult').textContent=resultText(m);$('matchResult').className='prediction-note '+statusClass(m.status);}
function setActive(i){active=Math.max(0,Math.min(matches.length-1,i));render();const card=gallery.children[active];if(card)gallery.scrollTo({left:card.offsetLeft-(gallery.clientWidth-card.offsetWidth)/2,behavior:'smooth'});if($('editor').classList.contains('open'))loadForm();}
$('prev').onclick=()=>setActive(active-1);$('next').onclick=()=>setActive(active+1);
async function loadMatches(){const {data,error}=await db.from('matches').select('*').order('match_time',{ascending:true});if(error){console.error(error);$('matchTitle').textContent='Maçlar yüklenemedi';$('matchComment').textContent='Supabase bağlantısını ve tablo izinlerini kontrol edin.';return;}matches=data||[];active=0;render();}
function isAdmin(){return !!user&&user.email?.toLowerCase()===ADMIN_EMAIL;}
function updateAdminUI(){ $('loginBox').classList.toggle('open',!isAdmin());$('editToggle').style.display=isAdmin()?'block':'none';$('logoutBtn').classList.toggle('hidden',!isAdmin());$('loginBtn').classList.toggle('hidden',isAdmin());$('email').classList.toggle('hidden',isAdmin());$('password').classList.toggle('hidden',isAdmin());$('loginMessage').textContent=isAdmin()?`Yönetici olarak giriş yapıldı: ${user.email}`:'Düzenleme alanı yalnızca yönetici hesabına açıktır.';if(!isAdmin())$('editor').classList.remove('open');}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value; if(!email||!password){$('loginMessage').textContent='E-posta ve şifreni gir.';return;}$('loginMessage').textContent='Giriş yapılıyor…';const {data,error}=await db.auth.signInWithPassword({email,password});if(error){$('loginMessage').textContent='Giriş başarısız: '+error.message;return;}user=data.user;updateAdminUI();await loadMatches();};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();user=null;updateAdminUI();$('editor').classList.remove('open');await loadMatches();};
db.auth.getSession().then(async({data})=>{user=data.session?.user||null;updateAdminUI();await loadMatches();});
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;updateAdminUI();});
function loadForm(){const m=matches[active];if(!m)return;editingId=m.id;$('homeTeam').value=m.home_team||'';$('awayTeam').value=m.away_team||'';$('meta').value=m.match_time||'';$('score').value=m.score||'';$('prediction').value=m.prediction||'';$('status').value=m.status||'Yaklaşan';$('commentary').value=m.commentary||'';$('published').checked=!!m.is_published;$('cover').value='';}
$('editToggle').onclick=()=>{if(!isAdmin())return;loadForm();$('editor').classList.toggle('open');};
$('cancelBtn').onclick=()=>$('editor').classList.remove('open');
$('newBtn').onclick=()=>{if(!isAdmin())return;editingId=null;$('homeTeam').value='';$('awayTeam').value='';$('meta').value='';$('score').value='';$('prediction').value='';$('status').value='Yaklaşan';$('commentary').value='';$('published').checked=false;$('cover').value='';$('editor').classList.add('open');$('saveMessage').textContent='Yeni maç bilgilerini doldurup kaydet.';};
$('saveBtn').onclick=async()=>{
 if(!isAdmin()){return;}const home_team=$('homeTeam').value.trim(),away_team=$('awayTeam').value.trim();if(!home_team||!away_team){$('saveMessage').textContent='İki takım adını da yazmalısın.';return;}
 $('saveMessage').textContent='Kaydediliyor…';
 let cover_url=matches.find(m=>m.id===editingId)?.cover_url||null;const file=$('cover').files[0];
 if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('saveMessage').textContent='Kapak JPG, PNG veya WEBP olmalı ve 5 MB sınırını aşmamalı.';return;}
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${crypto.randomUUID()}.${ext}`;const up=await db.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(up.error){$('saveMessage').textContent='Görsel yüklenemedi: '+up.error.message;return;}cover_url=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;}
 const payload={home_team,away_team,match_time:$('meta').value.trim(),score:$('score').value.trim(),prediction:$('prediction').value.trim(),status:$('status').value,commentary:$('commentary').value.trim(),cover_url,is_published:$('published').checked,updated_at:new Date().toISOString()};
 let result=editingId?await db.from('matches').update(payload).eq('id',editingId):await db.from('matches').insert(payload);
 if(result.error){$('saveMessage').textContent='Kaydedilemedi: '+result.error.message;return;}
 $('saveMessage').textContent='Kaydedildi.';$('editor').classList.remove('open');await loadMatches();
};
$('deleteBtn').onclick=async()=>{if(!isAdmin()||!editingId)return;if(!confirm('Bu maçı kalıcı olarak silmek istiyor musun?'))return;const {error}=await db.from('matches').delete().eq('id',editingId);if(error){$('saveMessage').textContent='Silinemedi: '+error.message;return;}matches.splice(active,1);active=Math.max(0,active-1);$('editor').classList.remove('open');render();};
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')setActive(active-1);if(e.key==='ArrowRight')setActive(active+1);});
})();
</script>
</body></html>
